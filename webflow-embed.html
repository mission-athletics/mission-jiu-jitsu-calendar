<!-- Mission Tournament Calendar: paste into a Webflow Embed element on the
     hidden page missionathletics.com/bjj-tournament-schedule. Ready to use as is. -->
<iframe id="mtc-bjj-frame"
  src="https://bjjtournaments.missionathletics.com/"
  title="Jiu Jitsu Tournament Schedule"
  style="display:block;width:100%;min-height:700px;border:0;background:#1C1C1E"
  loading="eager"></iframe>
<script>
  window.addEventListener("message", function (e) {
    if (e.origin !== "https://bjjtournaments.missionathletics.com") return;
    if (e.data && e.data.type === "mtc-height") {
      document.getElementById("mtc-bjj-frame").style.height = e.data.height + "px";
    }
  });
</script>
